function displayExercises(){

    let html = "";

    exercises.forEach(exercise => {

        html += `

        <div class="catalog-card"
             onclick="showDetails('${exercise.name}')">

            <h3>${exercise.name}</h3>

            <p>${exercise.muscle}</p>

        </div>

        `;
    });

    document.getElementById(
        "exerciseList"
    ).innerHTML = html;
}

function showDetails(name){

    const exercise =
        exercises.find(
            e => e.name === name
        );

    document.getElementById(
        "exerciseDetails"
    ).innerHTML =

    `
    <h2>${exercise.name}</h2>

    <p>
        <strong>Muscle Group:</strong>
        ${exercise.muscle}
    </p>

    <p>
        <strong>Equipment:</strong>
        ${exercise.equipment}
    </p>

    <p>
        <strong>Difficulty:</strong>
        ${exercise.difficulty}
    </p>

    <p>
        <strong>Instructions:</strong>
        ${exercise.instructions}
    </p>
    `;
}

function searchExercises(){

    const text =
        document.getElementById(
            "searchBox"
        ).value.toLowerCase();

    let html = "";

    exercises
    .filter(exercise =>
        exercise.name
        .toLowerCase()
        .includes(text)
    )

    .forEach(exercise => {

        html += `

        <div class="catalog-card"
             onclick="showDetails('${exercise.name}')">

            <h3>${exercise.name}</h3>

            <p>${exercise.muscle}</p>

        </div>

        `;
    });

    document.getElementById(
        "exerciseList"
    ).innerHTML = html;
}
